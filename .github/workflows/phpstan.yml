name: PHPStan

on:
  push:
    branches: [main]
    paths: ['**.php', 'phpstan.neon.dist', 'phpstan-baseline.neon', 'composer.json', '.github/workflows/phpstan.yml']
  pull_request:
    paths: ['**.php', 'phpstan.neon.dist', 'phpstan-baseline.neon', 'composer.json', '.github/workflows/phpstan.yml']

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/phpstan analyse --error-format=github --no-progress
